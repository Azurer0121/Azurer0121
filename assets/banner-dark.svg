<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="100%" role="img" aria-labelledby="bannerTitle bannerDesc" style="max-width:100%;height:auto">
  <title id="bannerTitle">Azurer0121 — AI tooling · developer tools · desktop apps</title>
  <desc id="bannerDesc">Dark neon banner for the GitHub profile of Azurer0121</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="0.55" stop-color="#0a0f1e"/>
      <stop offset="1" stop-color="#0d0a1c"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#3b82f6" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>

    <clipPath id="frame">
      <rect x="0" y="0" width="1280" height="280" rx="20"/>
    </clipPath>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .glyph { animation: breathe 7s ease-in-out infinite; }
      .glyph2 { animation: breathe 7s ease-in-out infinite; animation-delay: -3.5s; }
      @keyframes breathe {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 0.95; }
      }
      @media (prefers-reduced-motion: reduce) {
        .glyph, .glyph2 { animation: none; opacity: 0.8; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="1280" height="280" rx="20" fill="url(#bg)"/>
    <rect x="0" y="0" width="1280" height="280" fill="url(#grid)"/>

    <ellipse class="glyph"  cx="1010" cy="70"  rx="330" ry="190" fill="url(#glowCyan)"/>
    <ellipse class="glyph2" cx="250"  cy="235" rx="360" ry="190" fill="url(#glowViolet)"/>

    <rect x="0" y="0" width="1280" height="280" rx="20" fill="none" stroke="#22d3ee" stroke-opacity="0.22"/>

    <circle cx="72" cy="86" r="4" fill="#22d3ee"/>
    <circle cx="72" cy="86" r="9" fill="none" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text class="mono" x="98" y="93" font-size="17" fill="#67e8f9" fill-opacity="0.92" letter-spacing="2.5">GITHUB PROFILE</text>

    <text class="mono" x="68" y="182" font-size="92" font-weight="700" fill="url(#titleGrad)" letter-spacing="1">Azurer0121</text>

    <rect x="70" y="204" width="620" height="2" fill="url(#ruleGrad)"/>

    <text class="mono" x="70" y="243" font-size="22" fill="#e2e8f0" fill-opacity="0.88" letter-spacing="0.4">AI tooling · developer tools · desktop apps</text>

    <text class="mono" x="1210" y="243" font-size="20" fill="#94a3b8" fill-opacity="0.75" text-anchor="end">npx @deepseek-ai/dsh web</text>
  </g>
</svg>